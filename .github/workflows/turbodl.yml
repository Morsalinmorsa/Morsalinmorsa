name: Build TurboDL APK

on:
  push:
    paths:
      - "turbodl/**"
      - ".github/workflows/turbodl.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: turbodl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk TurboDL.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TurboDL-apk
          path: turbodl/TurboDL.apk

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: turbodl-build-${{ github.run_number }}
          name: TurboDL build ${{ github.run_number }}
          prerelease: true
          files: turbodl/TurboDL.apk
          body: |
            Test build of TurboDL from branch `${{ github.ref_name }}`.
            Download **TurboDL.apk** below and open it on your Android phone (Android 10 or newer).
